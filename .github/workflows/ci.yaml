name: CI

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "30 2 15 * *"

  workflow_dispatch:

jobs:
  format-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check formatting with dprint
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6

  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --accept '200..=299, 403' './**/*.md'
          fail: true

      - name: Create issue from report
        if: always() && steps.lychee.outputs.exit_code != '0' && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Lychee Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
