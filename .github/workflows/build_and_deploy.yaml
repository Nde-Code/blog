name: Build and deploy the blog

on:
  # Run workflow when changes are pushed to the main branch:
  push:
    branches:
      - main

  # Allow manual workflow execution from GitHub Actions:
  workflow_dispatch:

permissions:
  # Required permissions for GitHub Pages deployment:
  contents: read # Required to checkout repository contents.
  pages: write # Required to publish the Pages artifact.
  id-token: write # Required for OIDC-based deployment authentication.

concurrency:
  # Prevent conflicting deployments from running simultaneously:
  group: pages

  # Keep active deployments running until completion:
  cancel-in-progress: false

jobs:
  # 1st job: build
  # This job installs dependencies and generates the static website:
  build:
    # Use ubuntu-latest runner for a consistent Linux build environment:
    runs-on: ubuntu-latest

    # Define build tool versions and environment variables:
    env:
      GO_VERSION: 1.26.4 # Required by Hugo Modules.
      HUGO_VERSION: 0.163.3 # Hugo Extended version used for site generation.
      TZ: Europe/Brussels # Set timezone for consistent date handling.

    steps:
      # Step 1: Checkout repository sources:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive # Fetch Git submodules required by the project.
          fetch-depth: 0 # Fetch full history for accurate Git metadata.

      # Step 2: Set up Go environment required by Hugo Modules:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # Disable Go dependency caching.

      # Step 3: Configure GitHub Pages deployment settings:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Step 4: Install Hugo Extended:
      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      # Step 5: Display installed tool versions for debugging:
      - name: Verify installations
        run: |
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"

      # Step 6: Build the static website with Hugo:
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Step 7: Upload generated site files as a GitHub Pages artifact:
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  # 2nd job: deploy
  # This job publishes the generated artifact to GitHub Pages:
  deploy:
    # Use ubuntu-latest runner for deployment:
    runs-on: ubuntu-latest

    needs: build # Wait for the build job to complete successfully.

    # Associate deployment with the GitHub Pages environment:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 1: Deploy the uploaded artifact to GitHub Pages:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5